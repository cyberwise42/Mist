# Mist configuration. Copy to ~/.mist/config.yaml or pass with --config.

# --- Apple Silicon notes (M4 Pro / M4 Max) ------------------------------
# Ollama runs great locally via Metal and is the right choice for everyday
# local chat on a Mac. vLLM does not accelerate on Apple GPUs (CUDA/ROCm
# only) — point `base_url` at a remote vLLM server (a rented GPU box, a
# workstation on your LAN, etc.) if you want vLLM's continuous batching,
# especially for the `spawn_subagents` tool below.
#
# Model sizing by unified memory (Ollama's default tags are already
# Q4_K_M-quantized, leaving headroom for the OS and the embedding model):
#   36-48 GB : qwen2.5:14b   (default below)
#   64 GB    : qwen2.5:32b
#   128 GB   : qwen2.5:32b (fp16) or llama3.1:70b

backend: ollama            # ollama | vllm
model: qwen2.5:14b # 'ollama pull qwen2.5:14b'
base_url: http://localhost:11434   # vllm example: http://localhost:8000/v1
api_key: ""                # only needed for secured vLLM deployments
history_path: ~/.mist/history  # shared recall/autofill history for `mist chat` + `mist tui`

context:
  token_budget: 6000       # hard cap on assembled prompt
  history_turns: 6         # recent turns kept verbatim
  max_tool_output_chars: 2000  # tool results truncated beyond this
  max_tool_steps: 8        # tool calls allowed per turn before giving up;
                           # raise this on stronger models or for long tool
                           # chains (multi-step recon, a full llm-wiki ingest)

memory:
  db_path: ~/.mist/mist.db
  top_k: 3                 # memory snippets retrieved per turn
  keep_recent_sessions: 1  # sessions `mist compact` always leaves alone
  compact_min_turns: 4     # sessions shorter than this are skipped

skills:
  library_path: skills_library
  max_candidates: 4        # skill descriptions surfaced per turn

wiki:
  root_path: ~/.mist/wiki   # run `mist wiki-init` once to scaffold it

workspace:
  root_path: ~/.mist/workspace  # shell's cwd (local backend) — keeps downloaded files,
                                 # scan output, etc. out of wherever mist happens to be
                                 # launched from. Also the only place read_file/write_file/
                                 # search_files honor an absolute path outside the wiki root —
                                 # anywhere else on disk is refused, even if the model asks
                                 # for it directly.

embeddings:
  enabled: true
  backend: ollama           # ollama | vllm
  model: bge-m3           # `ollama pull bge-m3`
  base_url: http://localhost:11434
  api_key: ""
  similarity_threshold: 0.35  # min cosine similarity to accept a semantic skill match

tools:
  max_exposed: 5           # tools exposed to the model per call
  # enabled: [read_file, write_file, shell, search_files, remember, write_skill, spawn_subagents]
  #   ^ opt-in allow-list; omit (default) to expose every tool Mist supports
  shell:
    backend: local          # local | ssh
    ssh:
      host: ""
      user: ""
      port: 22
      key_path: ~/.ssh/id_ed25519
      timeout: 120

subagents:
  enabled: true
  max_workers: 4            # concurrent subagent calls; raise this against vLLM
  tools_enabled: true       # give each subagent its own read/write/shell/remember loop
  max_steps: 6              # bounded tool-loop length per subagent task

generation:
  temperature: 0.2
  max_tokens: 1024
  think: true  # Ollama only. Reasoning models (Qwen3, DeepSeek-R1, ...) emit a
               # <think> block. It's always forced off on schema-constrained
               # tool-decision calls (valid JSON is mandatory there regardless
               # of this setting). This flag controls the free-text answer
               # step only: true (default) lets the model reason fully over
               # tool output/memory/wiki context before answering, with the
               # <think> trace filtered out of the displayed stream; set to
               # false to disable reasoning there too (faster, shallower).
  # keep_alive: 30m  # Ollama only. How long to keep the model resident in VRAM
                     # between calls. Unset, Ollama uses its own ~5-min default —
                     # SHORTER than a single long tool step (the ssh shell timeout
                     # is 480s; a full nuclei scan ~3 min), so a slow scan unloads
                     # the model and the next call pays a full cold reload before
                     # generating. Accepts Ollama duration syntax ("30m", "60m") or
                     # -1 to pin forever. Trade GPU residency for latency to taste.
  # stream_no_content_timeout: 120  # seconds. Abort a streamed answer that has "thought"
                     # this long without emitting any visible content, returning a short
                     # message instead of stalling. Guards a runaway <think>: a reasoning
                     # model can burn its whole max_tokens budget thinking and never reach
                     # an answer — at a minutes-sized max_tokens that's a multi-minute stall
                     # producing nothing. Unset (default) = wait out the full token budget.

mission:
  max_turns: 40         # autonomous turns before a mission force-stops
  max_seconds: 3600     # wall-clock budget before a mission force-stops
  stuck_repeat_threshold: 3  # identical tool+args calls in a row -> auto-pause
