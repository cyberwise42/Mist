[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mist-agent"
version = "0.1.0"
description = "Context-frugal agent harness for small local LLMs (vLLM / Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cyberwise42" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
tui = ["textual>=0.58"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "textual>=0.58"]

[project.scripts]
mist = "mist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mist"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
